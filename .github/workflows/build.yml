name: Build Spark APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download ready libraries (No compiling!)
      run: |
        mkdir -p V2rayNG/app/libs
        curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v0.0.2/libv2ray.aar
        mkdir -p V2rayNG/app/src/main/jniLibs/arm64-v8a
        curl -L -o V2rayNG/app/src/main/jniLibs/arm64-v8a/libciadpi.so https://github.com/dovecoteescapee/ByeByeDPI/releases/download/v0.12.0/libciadpi_arm64-v8a.so

    - name: Fix Gradle bug and Rename to spark
      run: |
        # Удаляем строку, из-за которой падала сборка
        sed -i '/generateSyncIssueWhenLibraryConstraintsAreEnabled/d' V2rayNG/gradle.properties
        # Меняем название приложения на spark
        sed -i 's/v2rayNG/spark/g' V2rayNG/app/src/main/res/values/strings.xml

    - name: Build APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: spark-app
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
