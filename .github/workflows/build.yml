name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and build with Gradle
      run: |
        # Ищем, где лежит gradlew в проекте, и даем ему права
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        elif [ -f "./V2rayNG/gradlew" ]; then
          cd V2rayNG
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
        else
          echo "Gradlew not found!"
          exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whiteAr-v2rayNG-debug
        path: "**/build/outputs/apk/debug/*.apk"
