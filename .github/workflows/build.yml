name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download prebuilt libv2ray.aar
      run: |
        mkdir -p V2rayNG/app/libs
        curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/v2rayNG/raw/09d854dc784365e5499e444aff065055adcc5105/V2rayNG/app/libs/libv2ray.aar

    - name: Download ByeDPI library (libciadpi.so)
      run: |
        mkdir -p V2rayNG/app/src/main/jniLibs/arm64-v8a
        curl -L -o V2rayNG/app/src/main/jniLibs/arm64-v8a/libciadpi.so https://github.com/dovecoteescapee/ByeByeDPI/releases/download/v0.12.0/libciadpi_arm64-v8a.so

    - name: Build Debug APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whiteAr-v2rayNG-debug
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
