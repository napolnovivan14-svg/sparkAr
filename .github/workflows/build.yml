name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download prebuilt libv2ray.aar
      run: |
        mkdir -p V2rayNG/app/libs
        curl -L -o V2rayNG/app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v0.0.2/libv2ray.aar

    - name: Download ByeDPI library (libciadpi.so)
      run: |
        mkdir -p V2rayNG/app/src/main/jniLibs/arm64-v8a
        curl -L -o V2rayNG/app/src/main/jniLibs/arm64-v8a/libciadpi.so https://github.com/dovecoteescapee/ByeByeDPI/releases/download/v0.12.0/libciadpi_arm64-v8a.so

    - name: Fix Gradle warning and Rename app to spark
      run: |
        echo "android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false" >> V2rayNG/gradle.properties
        sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">spark<\/string>/' V2rayNG/app/src/main/res/values/strings.xml

    - name: Build Debug APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spark-v2rayNG-debug
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
