name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build Go Core (libv2ray.aar)
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
        cd AndroidLibXrayLite
        go mod tidy -v
        gomobile bind -v -androidapi 21 -ldflags="-s -w -checklinkname=0" -target=android -o ../V2rayNG/app/libs/libv2ray.aar ./

    - name: Download ByeDPI library (libciadpi.so)
      run: |
        mkdir -p V2rayNG/app/src/main/jniLibs/arm64-v8a
        curl -L -o V2rayNG/app/src/main/jniLibs/arm64-v8a/libciadpi.so https://github.com/dovecoteescapee/ByeByeDPI/releases/download/v0.12.0/libciadpi_arm64-v8a.so

    - name: Build Debug APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: whiteAr-v2rayNG-debug
        path: V2rayNG/app/build/outputs/apk/debug/*.apk
